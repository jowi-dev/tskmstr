[package]
name = "tskmstr"
version = "0.1.0"
edition = "2024"
description = "Jira/GitHub PR ticket linking CLI + TUI"

[lib]
name = "tskmstr"

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", features = ["json", "blocking", "rustls-tls"], default-features = false }
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
toml = "0.8"
rpassword = "7"
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
tempfile = "3"

[dev-dependencies]
httpmock = "0.7"
