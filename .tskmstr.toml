[backend]
provider = "github"

[work.lanes.tskmstr]
# Relative-path idiom (GitHub issue #5 phase 2): "." resolves to this
# repo's own root, so the lane runs in-place rather than in a separate
# worktree-of-a-worktree. Only valid in a repo-local .tskmstr.toml (see
# resolve_repo_path in src/config/mod.rs) -- the same value in the global
# config would error.
repo = "."
# prompt_file is a plain relative path, not `~`-expanded or resolved
# against `repo`: resolve_prompt_path (src/work/run.rs) only understands a
# leading `~` or an absolute path, so this is resolved against whatever
# directory `tm` is invoked from. That's fine here because `tm work run`/
# the board are always run from this repo's root -- if that stops being
# true, switch this to an absolute path.
prompt_file = "prompts/tskmstr-lane.md"
