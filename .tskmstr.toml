[backend]
provider = "github"

[work.lanes.tskmstr]
# Relative-path idiom (GitHub issue #5 phase 2): "." resolves to this
# repo's own root, so per-ticket worktrees are provisioned from this repo
# and the lane is always backend-compatible with this repo's board. Only
# valid in a repo-local .tskmstr.toml (see resolve_repo_path in
# src/config/mod.rs) -- the same value in the global config would error.
repo = "."
# Explicit rather than relying on the origin/HEAD fallback: a clone whose
# origin/HEAD symbolic ref was never set (git remote set-head) has nothing
# for resolve_base to fall back to, and the lane run fails preflight.
base_branch = "main"
# A relative prompt_file resolves against the lane's repo root (see
# resolve_prompt_path in src/work/run.rs), so the prompt lives in the repo
# it instructs and a run works no matter where `tm` was invoked from.
prompt_file = "prompts/tskmstr-lane.md"
